name: Test

on:
  pull_request:
    branches: 
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Run tests
        run: npm run test
  
  end2end-tests:
    runs-on: windows-latest
    
    steps:      
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Setup Node.js 18
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 18
      - name: Install
        run: npm install

      - name: Compile
        run: npx tsc -p tests\tsconfig.json

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build static data
        run: npm run build-mock-static-data

      - name: Start mock server
        run: npm run serve-website &
        shell: bash

      - name: Wait for the server
        run: ./.github/scripts/wait-for-server.ps1 -HostName "http://localhost:8080"
        shell: pwsh

      - name: Run tests
        run: npx playwright test tests/ --workers 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30