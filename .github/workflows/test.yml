name: Test

on:
  pull_request:
    branches: 
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Run tests
        run: npm run test
  
  end2end-tests:
    runs-on: windows-latest
    
    steps:      
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install
        run: npm install

      - name: Compile
        run: npx tsc -p tests\tsconfig.json

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build static data
        run: npm run build-mock-static-data

      - name: Start mock server
        run: npm run serve-website &
        shell: bash

      - name: Wait for the server
        run: ./.github/scripts/wait-for-server.ps1 -HostName "http://localhost:8080"
        shell: pwsh

      - name: Run tests
        run: npx playwright test tests/ --workers 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30