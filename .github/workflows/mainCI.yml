name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      deployments: read
      packages: none
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Build
        run: npm run build-static-data

      - name: Scan for accessibility issues
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        uses: microsoft/accessibility-insights-action@ecfbbc29c9a7f745ffd7ef8517b4cda6a59d4409 # v3.1.2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          site-dir: ${{ github.workspace }}/dist/website
          localhost-port: 12345
          input-urls: http://localhost:12345/profile http://localhost:12345/500 http://localhost:12345/404

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-reports
          path: ${{ github.workspace }}/_accessibility-reports
